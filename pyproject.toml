[project]
name = "tty-sudoku"
version = "0.1.0"
description = "A sudoku game for the terminal"
readme = "README.md"
authors = [
    { name = "Tuomas Huhtala", email = "tuomas.huhtala@unity3d.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
tty-sudoku = "tty_sudoku:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
